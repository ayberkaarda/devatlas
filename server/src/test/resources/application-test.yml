# Test configuration. This file intentionally contains NO `spring.datasource.*`
# block and NO port `5433` anywhere.
#
# Every integration test that needs a database provides its own throwaway
# Postgres via Testcontainers (see TestcontainersConfiguration, which uses
# @ServiceConnection to wire the container's JDBC url/credentials into the
# Spring context automatically). That means the test suite can never reach
# the docker-compose dev database on port 5433, on purpose: a test run must
# not be able to read, migrate, or wipe a developer's local data.
#
# If a future test needs a real `spring.datasource.url`, that is a bug: it
# means the test stopped using Testcontainers and started depending on
# whatever database happens to be reachable on the host.
spring:
  flyway:
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE

# Values below are fixtures, not credentials. They exist because the
# application refuses to start without a signing key and without a seed
# administrator, and a test container is thrown away at the end of the run.
# Nothing here is reachable from outside the test JVM.
devatlas:
  auth:
    jwt-secret: test-only-signing-key-not-a-secret-0123456789
    access-ttl: PT15M
    refresh-ttl: P60D
    refresh-grace: PT30S
    clock-skew: PT60S
    cookie-secure: false
    allowed-origins:
      - http://localhost:4200
  # Effectively unlimited for the suite. The counter is keyed by client IP and
  # every test in the run shares one (127.0.0.1), so production limits here would
  # make a green run depend on how many requests the classes ahead of this one
  # happened to make in the same minute -- a failure that appears and disappears
  # with test ordering. The limiter itself is exercised by lowering the budget
  # for the duration of one test instead, which keeps the assertion explicit and
  # the rest of the suite unaffected.
  rate-limit:
    manifest-per-minute: 1000000
    content-per-minute: 1000000

  seed:
    admin-email: admin@devatlas.test
    admin-password: seed-admin-password-for-tests
