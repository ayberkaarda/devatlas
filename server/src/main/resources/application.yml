spring:
  application:
    name: server

  # Local development datasource. This points at the docker-compose Postgres
  # container (docker-compose.yml at the repo root), which listens on host
  # port 5433, not the default 5432. The test suite never reads this block:
  # src/test/resources/application-test.yml pins tests to their own
  # Testcontainers-managed database instead.
  datasource:
    url: jdbc:postgresql://localhost:5433/bytelore
    username: bytelore
    password: bytelore_local_dev

  jpa:
    # Schema changes happen through Flyway migrations only. `validate` makes
    # Hibernate fail startup if the mapped entities disagree with the actual
    # schema instead of silently altering it. Never create/create-drop/update
    # here: those settings can drop and rebuild tables holding real data.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    # Refuses to run `flyway:clean` against this datasource, in every
    # profile, regardless of what triggers it. `clean` drops every object in
    # the schema and is unrecoverable against a developer's local database.
    clean-disabled: true

  jackson:
    # Every JSON property on this API is snake_case, request and response
    # alike, set once here rather than field by field. Doing it globally
    # removes an entire class of "which casing did that field use" bug across
    # the clients and means a newly added DTO cannot opt out by accident.
    property-naming-strategy: SNAKE_CASE

bytelore:
  auth:
    # HMAC signing key for access tokens. There is deliberately no default: a
    # default signing key is a key everybody has, including whoever reads this
    # repository. At least 32 bytes; startup fails otherwise.
    jwt-secret: ${BYTELORE_JWT_SECRET:}
    # Short enough that a leaked access token has little value, long enough
    # that an ordinary reading session makes few refresh calls.
    access-ttl: PT15M
    # Per token, not per family: every rotation issues a full fresh lifetime,
    # so regular use extends a session and only absence ends it.
    refresh-ttl: P60D
    # Window in which a repeat of a just-rotated token is read as a lost
    # response rather than a replay.
    refresh-grace: PT30S
    # Tolerance for clock drift when checking a token's time claims.
    clock-skew: PT60S
    cookie-name: bytelore_refresh
    cookie-path: /api/v1/auth
    # Off only where a browser talks to this API over plain HTTP, which is a
    # developer's machine and nowhere else (see application-dev.yml).
    cookie-secure: true
    # Origins permitted to make credentialed browser requests. Empty by
    # default: an origin list is a deployment input, and a wrong guess here
    # either blocks a real client or admits one that should not be admitted.
    #
    # A deployment must include the desktop webview origins alongside the web
    # build's own. The same application runs inside that webview and issues its
    # calls through the browser stack, so those requests are preflighted like
    # any other; leaving them out produces a failure that is hard to read --
    # every desktop call fails at the preflight with no body to inspect, while
    # identical code works in a browser.
    allowed-origins: ${BYTELORE_ALLOWED_ORIGINS:}

  rate-limit:
    # Per-IP budgets for the two anonymous endpoint families. They take no
    # credentials, so there is no principal to key a limit by and the client
    # address is what is left. The ratio is deliberate: a client reads a handful
    # of manifests and then downloads many packages, with up to three concurrent
    # transfers and resume, so a limit sized for manifest polling would strangle
    # a legitimate library download.
    manifest-per-minute: 60
    content-per-minute: 600
    # Progress sync, per authenticated user and per direction. This family has a
    # principal, so it is keyed by user id rather than by address: that neither
    # punishes an office for sharing an exit address nor can be shed by moving to
    # another network. The two directions hold separate budgets, so a device that
    # polls for another device's progress cannot thereby lose its ability to
    # upload its own.
    sync-progress-per-hour: 120
    # The five authentication budgets. Which layer enforces each one is decided
    # by its key: register and logout are keyed by the client address alone and
    # are refused in a filter before a body is parsed, while login (email plus
    # address), refresh (user) and the password change (user) are keyed by
    # something that only exists once the request has been parsed or the
    # presented credential resolved.
    login-per-15-minutes: 10
    register-per-hour: 5
    refresh-per-hour: 60
    logout-per-hour: 60
    password-change-per-hour: 5

  pipeline:
    # Every six hours, ShedLock'ed per whitelist source (§5.7 of the REST
    # contract). Spring cron: second minute hour day month weekday.
    fetch-cron: "0 0 0/6 * * *"
    http-connect-timeout: PT5S
    http-read-timeout: PT10S
    # Minimum normalized length a fetched item's raw content must have to pass
    # the CONTENT_SANITY check; guards against a well-formed but empty entry.
    min-content-length: 40
    # POST /admin/whitelist-sources/{id}/fetch, per source (§3.6).
    manual-fetch-per-hour: 6
    lock-at-most-for: PT10M
    lock-at-least-for: PT1S
    # Optional GitHub personal access token, attached only to a request whose host is exactly
    # api.github.com (most whitelist sources' verify_url_pattern; a few feed_urls too). Anonymous
    # GitHub API calls are capped at 60/hour; a token raises that to 5000/hour, which the sweep
    # across every enabled source needs to stay under. No default, and CI never supplies one: a
    # missing token logs one warning at startup and the pipeline proceeds anonymously rather than
    # failing to boot.
    github-token: ${BYTELORE_GITHUB_TOKEN:}
    # ITEM_RECENT cutoff: a feed item older than this by its own published/updated timestamp is
    # rejected before the pipeline ever spends a network request confirming its version. A missing
    # timestamp passes the check rather than failing it (§5.7).
    max-item-age: P14D

  seed:
    # The first administrator, created by the seed migration on an empty
    # database. Both values come from the environment and neither has a usable
    # default: this repository is public, so a literal password in a migration
    # would be a working credential published for good, beyond the reach of any
    # later commit to remove.
    #
    # Set both before the first start:
    #   BYTELORE_ADMIN_EMAIL=you@example.com
    #   BYTELORE_ADMIN_PASSWORD=<at least 12 characters>
    #
    # If either is missing the migration fails and the transaction rolls back,
    # so nothing is half-applied: set the variables and start again.
    admin-email: ${BYTELORE_ADMIN_EMAIL:}
    admin-password: ${BYTELORE_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # Only health and info are exposed; no env/beans/heapdump surface.
        include: health,info
  endpoint:
    health:
      show-details: never

# springdoc/OpenAPI is wired only under the `dev` profile — see
# application-dev.yml. It is absent here so a production/default boot never
# exposes /v3/api-docs or /swagger-ui.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
