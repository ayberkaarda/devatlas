# Active only when the `dev` Spring profile is selected (SPRING_PROFILES_ACTIVE=dev).
# Enables the OpenAPI document and Swagger UI for local exploration; neither is
# exposed in the base configuration (see application.yml).
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

bytelore:
  auth:
    # A `Secure` cookie is never sent over plain HTTP, so a local Angular dev
    # server on http://localhost would silently never receive the refresh
    # token. This is the one environment where that flag is off, and it is off
    # only here.
    cookie-secure: false
    allowed-origins:
      - http://localhost:4200
      # Desktop webview origins. They differ by platform and are listed here as
      # the values observed in practice; verify them against the running webview
      # rather than trusting a written table.
      - http://tauri.localhost
      - tauri://localhost
