[package]
name = "bytelore-desktop"
version = "0.1.0"
description = "ByteLore desktop client"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "bytelore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# `bundled` compiles SQLite from source and links it statically. Relying on a
# system libsqlite3 would make the on-disk format depend on whatever the user's
# machine happens to ship, which is unacceptable for a store that has to be
# readable across Windows and Linux builds of the same release.
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# The download engine is HTTP plus verification: a streaming client so that a
# truncated response is detectable before hashing, an async runtime to drive at
# most three transfers at once, and SHA-256 to prove a package arrived intact.
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[dev-dependencies]
tempfile = "3"
# A real HTTP server on a real socket. The engine's contract is written in terms
# of status codes, Range, If-Match and connections that drop mid-body; a hand
# rolled fake of the client would only assert that the fake matches the test.
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
