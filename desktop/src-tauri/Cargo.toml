[package]
name = "devatlas-desktop"
version = "0.1.0"
description = "DevAtlas desktop client"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "devatlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# `bundled` compiles SQLite from source and links it statically. Relying on a
# system libsqlite3 would make the on-disk format depend on whatever the user's
# machine happens to ship, which is unacceptable for a store that has to be
# readable across Windows and Linux builds of the same release.
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
