name: server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The integration tests start their own PostgreSQL through Testcontainers,
      # so no service container is declared here. GitHub's ubuntu runners ship a
      # working Docker daemon, which is all Testcontainers needs.
      - name: Check formatting
        run: ./mvnw -B -q spotless:check

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-reports
          path: |
            server/target/surefire-reports/
            server/target/failsafe-reports/
          retention-days: 7
