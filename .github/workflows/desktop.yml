name: desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'server/**'
      - 'docs/protocol/**'
      - 'rust-toolchain.toml'
      - '.nvmrc'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'server/**'
      - 'docs/protocol/**'
      - 'rust-toolchain.toml'
      - '.nvmrc'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  # Formatting, lints and unit tests do not need the web assets: the debug build
  # points at a dev server rather than a bundle. Running them on Linux only
  # keeps the feedback fast; packaging below is what covers both platforms.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # libayatana-appindicator3-dev and the older libappindicator3-dev declare
      # a mutual Conflicts, so asking for both leaves apt with no solution.
      # Ubuntu 24.04 ships the ayatana fork; that is the one Tauri links against.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      # The toolchain version comes from rust-toolchain.toml, which also pins
      # rustfmt and clippy, so it is not repeated here.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test

  # Every other desktop test runs against wiremock, a fake that can only ever
  # agree with itself. This job points the real Engine at the real server and
  # proves the two sides of the sync protocol actually interoperate: manifest
  # shapes, digest agreement, Range/If-Match resume behaviour and version
  # negotiation. It has its own job, separate from `check`, so that a server
  # that is slow to boot or a network hiccup on the runner cannot turn a fast,
  # deterministic unit-test job flaky.
  sync:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The desktop crate links against these even to run its unit and
      # integration tests, because it is a Tauri application crate.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-sync-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sync-

      # Started in the background on the fixed test port so it does not
      # collide with anything else the runner might have bound to 8080.
      - name: Start the server
        working-directory: server
        run: |
          nohup ./mvnw -q spring-boot:test-run \
            -Dspring-boot.run.main-class=dev.bytelore.server.TestServerApplication \
            -Dspring-boot.run.profiles=test \
            -Dspring-boot.run.arguments=--server.port=18080 \
            > ../server-sync.log 2>&1 &
          echo $! > ../server-sync.pid

      # Polls the protocol's own manifest endpoint rather than an actuator
      # health check, because the sync surface being up is what the live tests
      # depend on, not merely that the JVM started.
      #
      # The catalog has to carry a track, not merely answer 200. An empty
      # catalog is a perfectly valid 200 -- it is what the endpoint returns
      # when nothing is published -- so a status-only check passes and then
      # every live test fails on its own first assertion, describing the
      # protocol instead of the missing precondition. Waiting for a track puts
      # that failure here, next to the server log that explains it.
      - name: Wait for the server to answer the catalog endpoint with a track
        run: |
          for _ in $(seq 1 120); do
            body=$(curl -s --fail http://localhost:18080/api/v1/manifest/catalog || true)
            case "$body" in
              *'"track_id"'*)
                echo "catalog carried a track after ${SECONDS}s: $body"
                exit 0
                ;;
            esac
            sleep 1
          done
          echo "the catalog never carried a track within 120s; last body: ${body:-<none>}"
          cat server-sync.log || true
          exit 1

      - name: Live sync tests
        working-directory: desktop/src-tauri
        env:
          BYTELORE_API_BASE_URL: http://localhost:18080/api/v1
        run: cargo test --lib live_ -- --ignored --test-threads=1 --nocapture

      - name: Show server log on failure
        if: failure()
        run: cat server-sync.log || true

      - name: Stop the server
        if: always()
        run: |
          if [ -f server-sync.pid ]; then
            kill "$(cat server-sync.pid)" 2>/dev/null || true
          fi

  # Packaging is the only step that proves the desktop application actually
  # ships, and it is platform-specific, so it runs on both targets. macOS is
  # deliberately absent: it is not a supported target for this project.
  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-package-

      # tauri.conf.json points frontendDist at frontend/dist/tauri/browser, so
      # the web assets have to exist before the application can be packaged.
      - name: Build frontend desktop target
        working-directory: frontend
        run: |
          npm ci
          npm run build:tauri

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci

      # The updater artifacts this produces are signed, and signing needs the
      # private half of the key pair whose public half is in tauri.conf.json.
      # It lives only here, as a repository secret: the repository is public,
      # and a signing key that reaches the history cannot be taken back.
      # Without it the bundles are still built and then the run fails at the
      # signing step, which is the correct failure -- an unsigned build would
      # produce updates no client would accept.
      - name: Package
        working-directory: desktop
        run: npx tauri build --debug
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The Linux artifact uploaded below grew from 467 MB to 838 MB across
      # recent runs with no known cause, while the Windows growth over the
      # same period is explained by newly-added updater artifacts. This step
      # inventories what is actually sitting in the bundle directory right
      # before it is uploaded, so the next size jump can be attributed to a
      # leftover staging directory, a duplicated file, or unstripped debug
      # information instead of guessed at from the outside. It runs even
      # after a failed packaging step, because a run that fails late still
      # produced bundles worth measuring. Its own failures must never fail
      # the build -- a broken diagnostic is not a broken package -- so every
      # command here is best effort and the step always exits successfully.
      - name: Measure bundle contents
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          BUNDLE_DIR="desktop/src-tauri/target/debug/bundle"

          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "no bundle directory at $BUNDLE_DIR, nothing to measure"
            exit 0
          fi

          echo "## Sizes of bundle subdirectories and their entries"
          du -h --max-depth=2 "$BUNDLE_DIR" 2>&1 | sort -k2 || echo "du failed"

          echo
          echo "## Files larger than 5 MB, largest first"
          find "$BUNDLE_DIR" -type f -size +5M -printf '%s\t%p\n' 2>&1 \
            | sort -rn \
            | awk '{ printf "%.1f MB\t%s\n", $1 / 1024 / 1024, $2 }' \
            || echo "find/sort/awk failed"

          echo
          echo "## Debug information in the built binary (Linux only -- on Windows it lives in a separate .pdb, so Windows cannot answer this)"
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            if command -v file >/dev/null 2>&1; then
              for bin in desktop/src-tauri/target/debug/*; do
                [ -f "$bin" ] && [ -x "$bin" ] || continue
                echo "-- $bin --"
                file "$bin" 2>&1
                du -h "$bin" 2>&1
              done
            else
              echo "'file' command not available on this runner, skipping"
            fi
          else
            echo "skipped on ${RUNNER_OS:-unknown}"
          fi

          exit 0

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: bytelore-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/debug/bundle/**
          retention-days: 7
          if-no-files-found: error
